<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Details</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #0f172a;
        color: white;
      }

      header {
        background: #111827;
        padding: 20px;
      }

      header a {
        color: white;
        text-decoration: none;
        font-size: 18px;
      }

      .container {
        width: 90%;
        max-width: 1100px;
        margin: 40px auto;
      }

      .movie {
        display: flex;
        gap: 40px;
        background: #1e293b;
        padding: 25px;
        border-radius: 20px;
      }

      .movie img {
        width: 320px;
        border-radius: 15px;
      }

      .info {
        flex: 1;
      }

      .info h1 {
        font-size: 40px;
        margin-bottom: 15px;
      }

      .rating {
        color: gold;
        font-size: 22px;
        margin-bottom: 15px;
      }

      .genre {
        display: inline-block;
        background: #334155;
        padding: 8px 18px;
        border-radius: 20px;
        margin-bottom: 20px;
      }

      .info p {
        margin: 10px 0;
        color: #cbd5e1;
        line-height: 1.7;
      }

      .buttons {
        margin-top: 30px;
      }

      button {
        padding: 12px 25px;
        border: none;
        border-radius: 30px;
        margin-right: 15px;
        cursor: pointer;
        font-size: 16px;
      }

      .trailer {
        background: #e50914;
        color: white;
      }

      .book {
        background: #2563eb;
        color: white;
      }

      .cast {
        margin-top: 40px;
      }

      .cast h2 {
        margin-bottom: 20px;
      }

      .cast-list {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .actor {
        background: #334155;
        padding: 15px;
        border-radius: 10px;
        width: 120px;
        text-align: center;
      }

      .actor img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 10px;
      }

      @media (max-width: 768px) {
        .movie {
          flex-direction: column;
        }

        .movie img {
          width: 100%;
        }

        .info h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <a href="index.html">⬅ Back to Home</a>
    </header>

    <div class="container">
      <div class="movie">
        <img id="poster" />

        <div class="info">
          <h1 id="title"></h1>

          <div class="rating" id="rating"></div>

          <div class="genre" id="genre"></div>

          <p><b>Release:</b> <span id="release"></span></p>

          <p><b>Duration:</b> <span id="duration"></span></p>

          <p id="description"></p>

          <div class="buttons">
            <button class="trailer">▶ Watch Trailer</button>
            <button class="book">🎟 Book Tickets</button>
          </div>
        </div>
      </div>

      <div class="cast">
        <h2>Cast</h2>

        <div class="cast-list">
          <div class="actor">
            <img src="https://i.pravatar.cc/100?img=1" />
            <p>Actor 1</p>
          </div>

          <div class="actor">
            <img src="https://i.pravatar.cc/100?img=2" />
            <p>Actor 2</p>
          </div>

          <div class="actor">
            <img src="https://i.pravatar.cc/100?img=3" />
            <p>Actor 3</p>
          </div>

          <div class="actor">
            <img src="https://i.pravatar.cc/100?img=4" />
            <p>Actor 4</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const movies = {
        1: {
          title: "Avengers",
          poster: "https://picsum.photos/400/600?random=1",
          rating: "⭐ 8.9",
          genre: "Action / Adventure",
          release: "2019",
          duration: "3h 2m",
          description:
            "The Avengers assemble one final time to reverse Thanos' actions and restore balance to the universe.",
        },

        2: {
          title: "Batman",
          poster: "https://picsum.photos/400/600?random=2",
          rating: "⭐ 8.7",
          genre: "Action / Crime",
          release: "2022",
          duration: "2h 56m",
          description:
            "Batman uncovers corruption in Gotham while pursuing a mysterious serial killer.",
        },

        3: {
          title: "Interstellar",
          poster: "https://picsum.photos/400/600?random=3",
          rating: "⭐ 8.8",
          genre: "Sci-Fi",
          release: "2014",
          duration: "2h 49m",
          description:
            "A team of astronauts travel through a wormhole in search of a new home for humanity.",
        },

        4: {
          title: "Joker",
          poster: "https://picsum.photos/400/600?random=4",
          rating: "⭐ 8.5",
          genre: "Drama",
          release: "2019",
          duration: "2h 2m",
          description:
            "A failed comedian begins a downward spiral that changes Gotham forever.",
        },

        5: {
          title: "Dune",
          poster: "https://picsum.photos/400/600?random=5",
          rating: "⭐ 8.3",
          genre: "Adventure",
          release: "2021",
          duration: "2h 35m",
          description:
            "Paul Atreides leads the fight for the desert planet Arrakis.",
        },

        6: {
          title: "Spider-Man",
          poster: "https://picsum.photos/400/600?random=6",
          rating: "⭐ 8.4",
          genre: "Action",
          release: "2021",
          duration: "2h 28m",
          description: "Peter Parker faces villains from different universes.",
        },

        7: {
          title: "Thor",
          poster: "https://picsum.photos/400/600?random=7",
          rating: "⭐ 8.2",
          genre: "Fantasy",
          release: "2022",
          duration: "2h",
          description:
            "Thor begins a journey unlike anything he has ever faced.",
        },

        8: {
          title: "Doctor Strange",
          poster: "https://picsum.photos/400/600?random=8",
          rating: "⭐ 8.1",
          genre: "Fantasy",
          release: "2022",
          duration: "2h 6m",
          description:
            "Doctor Strange explores the multiverse and its dangerous consequences.",
        },
      };

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      const movie = movies[id];

      document.getElementById("title").innerHTML = movie.title;
      document.getElementById("poster").src = movie.poster;
      document.getElementById("rating").innerHTML = movie.rating;
      document.getElementById("genre").innerHTML = movie.genre;
      document.getElementById("release").innerHTML = movie.release;
      document.getElementById("duration").innerHTML = movie.duration;
      document.getElementById("description").innerHTML = movie.description;
    </script>
  </body>
</html>
