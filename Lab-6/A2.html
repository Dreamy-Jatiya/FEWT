<!--2. Demonstrate different array functions like push, pop, shift, unshift, splice, sort etc… (A) 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr=[10,20,30,40,50,60,70,80,90];
        document.write("<b>Array -  </b>"+arr);
        document.write("</br>");
        document.write("</br>");

        arr.push(100);
        document.write("<b>push(100)-  </b>"+arr+"</br>");

        arr.pop(5);
        document.write("<b>pop(5)-  </b>"+arr+"</br>");

        arr.shift();
        document.write("<b>shift()-  </b>"+arr+"</br>");

        arr.unshift(25);
        document.write("<b>unshift(25)-  </b>"+arr+"</br>");

        arr.splice(1,3,8);
        document.write("<b>splice(1,3,8)-  </b>"+arr+"</br>");

        result=arr.slice(2,6);
        document.write("<b>slice(2,6)-  </b>"+result+"</br>");

        arr.sort();
        document.write("<b>sort()-  </b>"+arr+"</br>");
    </script>
</body>
</html>
