<!--8. write a jQuery to hide all siblings when clicked on a button. (A) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div>
        <p>Paragraph 1</p>
        <p>Paragraph 2</p>
        <p>Paragraph 3</p>
    </div>
    <button id="hideSiblings">Hide Siblings</button>

    <script>
        $(document).ready(() => {
            $("#hideSiblings").click(() => {
                $("p").not(":first").hide();
            });
        });
    </script>
</body>
</html>
