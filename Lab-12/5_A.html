<!--5. write a jQuery program to append new list item with "Hello World" to existing unordered list 
when clicked on button. (A) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <ul id="myList">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <button id="addItem">Add Item</button>

    <script>
        $(document).ready(() => {
            $("#addItem").click(() => {
                $("#myList").append("<li>Hello World</li>");
            });
        });
    </script>
</body>
</html>
