<!--12. write a jQuery program to change background color of all input tags when clicked on a button (A) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <input type="text" placeholder="Input 1">
    <input type="text" placeholder="Input 2">
    <input type="text" placeholder="Input 3">
    <button id="changeBackcolor">Change Background Color</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(() => {
            $("#changeBackcolor").click(() => {
                $("input").css("background-color", "lightblue");
            });
        });
    </script>
</body>
</html>
