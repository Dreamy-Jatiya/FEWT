*{
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body{
    margin: 0;
    background: #f2f6ff;
}

/* Header */
.header{
    background: linear-gradient(135deg, #101010, #333);
    padding: 25px;
    text-align: center;
    color: white;
}

h1{
    margin: 0;
    color: rgb(243,160,202);
    font-size: 40px;
}

.header h2{
    margin: 10px 0;
    color: rgb(142,211,243);
    font-size: 25px;
}


/* Main container */
.container{
    width: 90%;
    margin: 30px auto;
}


/* Buttons */
.btn-row{
    text-align: center;
    margin-bottom: 30px;
}

.present-btn,
.absent-btn{
    width: 180px;
    height: 55px;
    margin: 10px;
    border: none;
    border-radius: 25px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    background: linear-gradient(135deg,#8ed3f3,pink);
}

.present-btn:hover,
.absent-btn:hover{
    transform: scale(1.05);
    box-shadow: 0 5px 15px gray;
}


/* Roll number area */
#rollNo{
    width: 65%;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}


/* Each student row */
.roll-chip{
    display:flex;
    align-items:center;
    gap:15px;
    margin:10px 0;
    padding:10px;
    border-radius:10px;
    background:#eef7ff;
    font-size:18px;
}


.roll-chip input[type="checkbox"]{
    width:20px;
    height:20px;
    cursor:pointer;
}


.roll-chip span{
    width:60px;
    font-weight:bold;
    color:#0057b8;
}


/* Student name */
.student-name{
    color:#222;
    font-size:18px;
}


/* Absentee box */
.note-card{
    position:fixed;
    right:40px;
    top:200px;
    width:300px;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}


.note-card h2{
    margin:0 0 10px;
    color:#e83e8c;
    text-align:center;
}


.count{
    display:block;
    text-align:center;
    color:gray;
    margin-bottom:10px;
}


#absentList{
    width:100%;
    height:350px;
    resize:none;
    padding:15px;
    font-size:16px;
    border-radius:10px;
    border:2px solid #ddd;
    background:#fff8fc;
}


/* Mobile view */
@media(max-width:900px){

    #rollNo{
        width:100%;
    }

    .note-card{
        position:static;
        width:100%;
        margin-top:30px;
    }

    h1{
        font-size:30px;
    }

    .present-btn,
    .absent-btn{
        width:140px;
    }
}

</style>

    <script>



        function checkedUnchecked(temp){
           let allStudent = document.querySelectorAll('input[type="checkbox"]');
            for(i=0;i<allStudent.length;i++){
                allStudent[i].checked = temp;
            }
            updateAbsent();
        }
        function updateAbsent(){
       let allStudent = document.querySelectorAll('input[type="checkbox"]');
            absent=[];
            for(i=0;i<allStudent.length;i++){
                if(!allStudent[i].checked){
                    absent.push(allStudent[i].value);
                }
            }
            document.getElementById("absentList").innerHTML = absent;
        }
