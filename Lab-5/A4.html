<!--4. WAP to read an array form the user and sort them using quick sort. (B) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sort</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter Array Size - "));
        let arr = [];

        for(i = 0; i < n; i++){
            arr[i] = parseInt(prompt("Enter Elements - "));
        }

        function quickSort(arr, low, high){
            if(low < high){
                let pivot = arr[high];
                let i = low - 1;

                for(j = low; j < high; j++){
                    if(arr[j] < pivot){
                        i++;

                        let temp = arr[i];
                        arr[i] = arr[j];
                        arr[j] = temp;
                    }
                }

                let temp = arr[i + 1];
                arr[i + 1] = arr[high];
                arr[high] = temp;

                let pi = i + 1;

                quickSort(arr, low, pi - 1);
                quickSort(arr, pi + 1, high);
            }
        }

        quickSort(arr, 0, n - 1);

        document.write("Sorted Array: " + arr);
    </script>
</body>
</html>
