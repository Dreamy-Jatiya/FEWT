<!--Display Floor, Ceiling, Round, and Truncate values of a decimal number.  (A) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="operation()" style="background-color: darkorange;">Give Value</button>
    <script>
        document.write("<br>");
        document.write("<br>");
        document.write("Click on button to get the Floor,Ceiling,Round and Truncate values of Decimal Number");
        document.write("<br>");
        function operation(){
            document.write("Floor of Number <b>7.6</b>  --->  "+Math.floor(7.6));
            document.write("<br>");
            document.write("Ceiling of Number <b>7.6</b>  ---> "+Math.ceil(7.6));
            document.write("<br>");
            document.write("Round Number of <b>17.6</b>  --->  "+Math.round(17.6));
            document.write("<br>");
            document.write("Truncate Number of <b>25.6</b>  --->  "+Math.trunc(25.6));
        }
    </script>
</body>
</html>
