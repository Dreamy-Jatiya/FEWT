<!--9. Generate a Random Password (digits only) of user-defined length using the Math 
object. (B) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <button onclick="operation()" style="background-color: darkorange;">Give Value</button>
    <script>
        document.write("<br>");
        document.write("<br>");
        document.write("Click on button to get the Random Password (digits only) of user-defined length using the Math object.");
        document.write("<br>");
        function operation(){
            var length = prompt("Enter the length of the password:");
            var password = "";
            for (var i = 0; i < length; i++) {
                password += Math.floor(Math.random() * 10); // Generate a random digit (0-9)
            }
            document.write("Random Password: " + password);
        }
    </script>
</body>
</html>
