<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1 id="myid">Hello World by ID</h1>
    <h1 class="myclass">Hello World by Class</h1>
    <h1>Hello World by Nothing</h1>

    <script>
        $("#mybtn").click(()=>{
            $("#myid").hide();  
        });

    </script>
</body>
</html>
